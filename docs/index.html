<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InMoov STL Files</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 15px;
            color: #222;
            background: #fff;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        header {
            border-bottom: 2px solid #222;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: 1.4rem;
        }

        header p {
            color: #666;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .breadcrumb {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .breadcrumb a {
            color: #0066cc;
            text-decoration: none;
            cursor: pointer;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .status {
            font-size: 0.78rem;
            color: #999;
            margin-bottom: 0.75rem;
            min-height: 1.2em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        tr {
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9f9;
        }

        td {
            padding: 0.6rem 0.5rem;
            vertical-align: middle;
        }

        td:first-child {
            width: 24px;
            text-align: center;
        }

        td:last-child {
            width: 80px;
            text-align: right;
            color: #666;
            font-size: 0.8rem;
        }

        .name {
            color: #0066cc;
            text-decoration: none;
            cursor: pointer;
        }

        .name:hover {
            text-decoration: underline;
        }

        .loading {
            color: #999;
            font-size: 0.85rem;
            padding: 2rem 0;
            text-align: center;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
            align-items: center;
            justify-content: center;
        }

        .overlay.open {
            display: flex;
        }

        .modal {
            background: #fff;
            border: 1px solid #ccc;
            width: 90%;
            max-width: 640px;
            border-radius: 4px;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .modal-header button {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: #666;
        }

        #canvas-container {
            width: 100%;
            height: 360px;
            background: #f0f0f0;
            position: relative;
        }

        #canvas-container canvas {
            width: 100% !important;
            height: 100% !important;
        }

        #canvas-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 0.85rem;
        }

        .modal-footer {
            padding: 0.75rem 1rem;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #666;
        }

        .modal-meta {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            margin-right: 1rem;
        }

        .modal-meta #modal-path {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #modal-dims {
            color: #333;
            font-variant-numeric: tabular-nums;
        }

        #modal-dims .oversize {
            color: #b45309;
        }

        .dl {
            background: #222;
            flex-shrink: 0;
            color: #fff;
            padding: 0.4rem 0.9rem;
            border-radius: 3px;
            text-decoration: none;
            font-size: 0.8rem;
        }

        footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
            font-size: 0.8rem;
            color: #999;
        }

        footer a {
            color: #0066cc;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>InMoov - STL Files</h1>
        <p>InMoov Robot Parts · <a href="https://github.com/Shayan-Mazahir/ATOM-InMoov-Robot"
                style="color:#0066cc">GitHub</a></p>
    </header>

    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="status" id="status"></div>

    <table>
        <tbody id="tbody">
            <tr>
                <td colspan="3" class="loading">Loading...</td>
            </tr>
        </tbody>
    </table>

    <div class="overlay" id="overlay">
        <div class="modal">
            <div class="modal-header">
                <span id="modal-name">file.stl</span>
                <button onclick="closeModal()">✕</button>
            </div>
            <div id="canvas-container">
                <div id="canvas-loading">Loading model...</div>
            </div>
            <div class="modal-footer">
                <div class="modal-meta">
                    <span id="modal-path"></span>
                    <span id="modal-dims"></span>
                </div>
                <a class="dl" id="dl-btn" download>Download</a>
            </div>
        </div>
    </div>

    <footer>
        <a href="https://inmoov.fr">InMoov by Gaël Langevin</a> ·
        Website built by <a href="https://github.com/Shayan-Mazahir">Raza</a>
    </footer>

    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

    <script type="module">
        // three.js is loaded on demand, NOT at the top of this file.
        // A static import here would mean a slow or blocked CDN stops the whole
        // script from running, leaving the file list stuck on "Loading..." even
        // though browsing files needs no 3D at all. It also saves everyone who
        // never opens a model from downloading the library.
        let THREE, STLLoader, OrbitControls;

        async function ensureThree() {
            if (THREE) return;
            const [three, stl, orbit] = await Promise.all([
                import('three'),
                import('three/addons/loaders/STLLoader.js'),
                import('three/addons/controls/OrbitControls.js')
            ]);
            THREE = three;
            STLLoader = stl.STLLoader;
            OrbitControls = orbit.OrbitControls;
        }

        // ─── Config ───────────────────────────────────────────────────────────────
        const REPO = "Shayan-Mazahir/ATOM-InMoov-Robot";
        const BRANCH = "main";
        const ROOT_PATH = "stl-files";
        const BED_MM = 220;   // Flashforge Adventurer 5M build volume, used to flag oversized parts
        const API = `https://api.github.com/repos/${REPO}`;
        const RAW = `https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
        const CACHE_KEY = "atom_stl_cache_v2";
        const COMMIT_KEY = "atom_last_tree_sha";
        const TIME_KEY = "atom_last_check";
        const CHECK_INTERVAL = 60 * 60 * 1000;

        let currentPath = ROOT_PATH;
        let cachedContents = {};

        // ─── Three.js viewer ──────────────────────────────────────────────────────
        let renderer, scene, camera, controls, animId;
        let currentMesh = null;   // the STL currently on screen, tracked so it can be disposed
        let resizeObserver = null;

        function initThree() {
            const container = document.getElementById('canvas-container');
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setClearColor(0xf0f0f0);
            container.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 10000);
            camera.position.set(0, 0, 200);

            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const dir = new THREE.DirectionalLight(0xffffff, 0.8);
            dir.position.set(1, 2, 3);
            scene.add(dir);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Keep the camera and canvas in step with the container size.
            // The canvas is stretched to 100% by CSS, so without this the model
            // distorts whenever the window or phone orientation changes.
            resizeObserver = new ResizeObserver(() => {
                if (!renderer || !camera) return;
                const w = container.clientWidth;
                const h = container.clientHeight;
                if (!w || !h) return;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });
            resizeObserver.observe(container);

            function animate() {
                animId = requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }

        // Remove the current mesh and release its GPU buffers.
        // Dropping the reference alone is not enough - geometry and material
        // hold WebGL resources that only dispose() frees.
        function clearModel() {
            if (!currentMesh) return;
            if (scene) scene.remove(currentMesh);
            currentMesh.geometry.dispose();
            currentMesh.material.dispose();
            currentMesh = null;
        }

        function setCanvasMessage(msg) {
            const el = document.getElementById('canvas-loading');
            el.textContent = msg;
            el.style.display = 'flex';
        }

        // Bounding box in millimetres. STL has no unit header, but every slicer
        // and every InMoov part treats the numbers as mm, so this is the size
        // the part will actually print at.
        function showDimensions(size) {
            const dims = [size.x, size.y, size.z].map(v => v.toFixed(1));
            const oversize = Math.max(size.x, size.y, size.z) > BED_MM;
            document.getElementById('modal-dims').innerHTML =
                `${dims.join(' × ')} mm` +
                (oversize ? ` <span class="oversize">· exceeds ${BED_MM}mm bed</span>` : '');
        }

        function loadSTL(url, token) {
            clearModel();

            setCanvasMessage('Loading model...');

            const loader = new STLLoader();
            loader.load(url, (geometry) => {
                if (token !== loadToken) { geometry.dispose(); return; }   // superseded or closed

                geometry.computeBoundingBox();
                const box = geometry.boundingBox;
                const center = new THREE.Vector3();
                box.getCenter(center);
                geometry.translate(-center.x, -center.y, -center.z);

                const size = new THREE.Vector3();
                box.getSize(size);
                showDimensions(size);
                const maxDim = Math.max(size.x, size.y, size.z) || 1;

                // Frame the part based on its actual size.
                // controls.reset() has to happen BEFORE the camera is moved:
                // it restores the position the controls were built with, so
                // calling it afterwards would throw this framing away.
                controls.reset();
                controls.target.set(0, 0, 0);
                camera.position.set(0, 0, maxDim * 1.8);
                camera.near = maxDim / 100;
                camera.far = maxDim * 100;
                camera.updateProjectionMatrix();
                controls.update();
                controls.saveState();   // so a later reset() returns to this fitted view

                const material = new THREE.MeshPhongMaterial({ color: 0x909090, specular: 0x111111, shininess: 30 });
                currentMesh = new THREE.Mesh(geometry, material);
                scene.add(currentMesh);

                document.getElementById('canvas-loading').style.display = 'none';
            }, (evt) => {
                // Progress feedback. Some of these parts are over 1 MB, which is
                // a long silent wait on a phone connection.
                if (token !== loadToken) return;
                if (evt.lengthComputable && evt.total) {
                    setCanvasMessage(`Loading model... ${Math.round(evt.loaded / evt.total * 100)}%`);
                } else if (evt.loaded) {
                    setCanvasMessage(`Loading model... ${formatSize(evt.loaded)}`);
                }
            }, () => {
                if (token !== loadToken) return;
                setCanvasMessage('Failed to load model');
            });
        }

        function destroyThree() {
            if (animId) cancelAnimationFrame(animId);
            if (resizeObserver) {
                resizeObserver.disconnect();
                resizeObserver = null;
            }
            clearModel();
            if (controls) controls.dispose();
            if (renderer) {
                renderer.dispose();
                renderer.forceContextLoss();   // browsers cap concurrent WebGL contexts
                const container = document.getElementById('canvas-container');
                if (renderer.domElement.parentNode === container) {
                    container.removeChild(renderer.domElement);
                }
            }
            renderer = scene = camera = controls = animId = null;
        }

        // ─── Cache ────────────────────────────────────────────────────────────────
        function saveCache(contents, commitSha) {
            localStorage.setItem(CACHE_KEY, JSON.stringify(contents));
            localStorage.setItem(COMMIT_KEY, commitSha);
            localStorage.setItem(TIME_KEY, Date.now().toString());
        }

        function loadCache() {
            try {
                return {
                    contents: JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'),
                    commitSha: localStorage.getItem(COMMIT_KEY),
                    lastCheck: parseInt(localStorage.getItem(TIME_KEY) || '0')
                };
            } catch {
                return { contents: null, commitSha: null, lastCheck: 0 };
            }
        }

        // ─── GitHub API ───────────────────────────────────────────────────────────
        // The whole file tree comes back in ONE request via the Git Trees API.
        // The old approach walked the contents API folder by folder, which cost
        // roughly 17 requests to browse everything. Unauthenticated callers only
        // get 60 requests per hour per IP, so that ran out fast on a few reloads.
        class RateLimitError extends Error {
            constructor(resetEpochSeconds) {
                const mins = resetEpochSeconds
                    ? Math.max(1, Math.ceil((resetEpochSeconds * 1000 - Date.now()) / 60000))
                    : null;
                super(mins
                    ? `GitHub API rate limit reached. Try again in about ${mins} min.`
                    : `GitHub API rate limit reached. Try again shortly.`);
                this.rateLimited = true;
            }
        }

        async function fetchTree() {
            const r = await fetch(`${API}/git/trees/${BRANCH}?recursive=1`);

            // 403/429 with no remaining quota means rate limited, not missing data.
            // Returning an empty list here is what used to render as "Empty folder".
            if (r.status === 403 || r.status === 429) {
                if (r.headers.get('x-ratelimit-remaining') === '0') {
                    throw new RateLimitError(Number(r.headers.get('x-ratelimit-reset')));
                }
                throw new Error('GitHub denied the request (403).');
            }
            if (!r.ok) throw new Error(`GitHub API error ${r.status}.`);
            return await r.json();
        }

        // Flat tree list -> { "folder/path": [items] } so render() can look up
        // any folder directly. Only paths under ROOT_PATH are kept.
        function buildTree(nodes) {
            const store = { [ROOT_PATH]: [] };
            const ensure = (dir) => (store[dir] ||= []);

            for (const node of nodes) {
                if (!node.path.startsWith(ROOT_PATH + '/')) continue;

                const cut = node.path.lastIndexOf('/');
                const isDir = node.type === 'tree';

                ensure(node.path.slice(0, cut)).push({
                    name: node.path.slice(cut + 1),
                    path: node.path,
                    type: isDir ? 'dir' : 'file',
                    size: node.size
                });

                if (isDir) ensure(node.path);   // so empty folders still resolve
            }
            return store;
        }

        // ─── Init ─────────────────────────────────────────────────────────────────
        async function init() {
            setStatus("Checking cache...");
            const { contents, commitSha, lastCheck } = loadCache();
            const now = Date.now();
            const hourPassed = (now - lastCheck) > CHECK_INTERVAL;

            if (contents && !hourPassed) {
                cachedContents = contents;
                setStatus(`Cached · last checked ${timeSince(lastCheck)} ago`);
                render();
                return;
            }

            setStatus("Checking for updates...");
            try {
                const data = await fetchTree();
                const sha = data.sha;

                cachedContents = buildTree(data.tree || []);
                saveCache(cachedContents, sha);

                if (data.truncated) {
                    setStatus("Warning: the file tree was too large and GitHub truncated it.");
                } else {
                    setStatus(sha === commitSha
                        ? `No changes · ${sha?.slice(0, 7)}`
                        : `Updated · ${sha?.slice(0, 7)}`);
                }
                render();
            } catch (e) {
                // Fall back to whatever is cached rather than showing nothing.
                if (contents) {
                    cachedContents = contents;
                    setStatus(e.rateLimited
                        ? `${e.message} Showing cached files.`
                        : "Could not reach GitHub. Showing cached files.");
                    render();
                } else {
                    setStatus(e.rateLimited ? e.message : "Failed to load. Check your connection.");
                    document.getElementById('tbody').innerHTML =
                        `<tr><td colspan="3" class="loading">${e.rateLimited ? 'Rate limited by GitHub.' : 'Could not load files.'}</td></tr>`;
                }
            }
        }

        // ─── Render ───────────────────────────────────────────────────────────────
        function render() {
            const items = cachedContents[currentPath] || [];
            const parts = currentPath.split('/');
            let bc = '';
            parts.forEach((part, i) => {
                const partPath = parts.slice(0, i + 1).join('/');
                if (i < parts.length - 1) bc += `<a onclick="navigate('${partPath}')">${part}</a> / `;
                else bc += part;
            });
            document.getElementById('breadcrumb').innerHTML = bc;

            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';

            if (currentPath !== ROOT_PATH) {
                const parentPath = currentPath.split('/').slice(0, -1).join('/');
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>📁</td><td><a class="name" onclick="navigate('${parentPath}')">.. (back)</a></td><td></td>`;
                tbody.appendChild(tr);
            }

            if (items.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="3" class="loading">Empty folder</td>`;
                tbody.appendChild(tr);
                return;
            }

            const sorted = [...items].sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'dir' ? -1 : 1;
            });

            sorted.forEach(item => {
                const tr = document.createElement('tr');
                if (item.type === 'dir') {
                    const subItems = cachedContents[item.path];
                    const count = subItems ? subItems.length : '...';
                    tr.innerHTML = `<td>📁</td><td><a class="name" onclick="navigate('${item.path}')">${item.name}</a></td><td>${count} items</td>`;
                } else if (item.name.toLowerCase().endsWith('.stl')) {
                    const rawUrl = `${RAW}/${item.path}`;
                    tr.innerHTML = `<td>⬡</td><td><a class="name" onclick="openModal('${item.name}','${rawUrl}','${item.path}')">${item.name}</a></td><td>${formatSize(item.size)}</td>`;
                } else if (item.name.toLowerCase().endsWith('.txt')) {
                const rawUrl = `${RAW}/${item.path}`;
                tr.innerHTML = `<td>📄</td><td><a class="name" href="${rawUrl}" target="_blank">${item.name}</a></td><td>TXT</td>`;
                } else {
                    tr.innerHTML = `<td>📄</td><td>${item.name}</td><td>${formatSize(item.size)}</td>`;
                }
                tbody.appendChild(tr);
            });
        }

        // ─── Deep links ───────────────────────────────────────────────────────────
        // The current folder (or open part) lives in the URL hash, so any view
        // here can be linked to directly:
        //   #stl-files/forearm/right/support
        //   #stl-files/hands/i2_RightHand/no support/i2_HandCoverV1.stl
        // encodeURI is used rather than encodeURIComponent so the slashes stay
        // readable while spaces in folder names like "no support" get escaped.
        function pathToHash(p) { return '#' + encodeURI(p); }

        function hashToPath() {
            try { return decodeURI(location.hash.slice(1)); } catch { return ''; }
        }

        function setHash(p) {
            const h = pathToHash(p);
            if (location.hash === h) return;   // also stops hashchange from looping
            location.hash = h;
        }

        function applyHash() {
            if (!cachedContents[ROOT_PATH]) return;   // nothing loaded to point at yet

            const target = hashToPath();
            const overlay = document.getElementById('overlay');

            // currentPath is updated BEFORE closing the modal in both branches
            // below. closeModal() writes currentPath back into the hash, so
            // closing first would overwrite the destination we are navigating to.

            // No hash, or something outside the STL tree: go home
            if (!target || !target.startsWith(ROOT_PATH)) {
                if (currentPath !== ROOT_PATH) { currentPath = ROOT_PATH; render(); }
                if (overlay.classList.contains('open')) window.closeModal();
                return;
            }

            // A folder
            if (cachedContents[target]) {
                if (target !== currentPath) { currentPath = target; render(); }
                if (overlay.classList.contains('open')) window.closeModal();
                return;
            }

            // A file: show the folder it lives in, and open the viewer for STLs
            const parent = target.slice(0, target.lastIndexOf('/'));
            const item = (cachedContents[parent] || []).find(i => i.path === target);
            if (!item) return;

            if (parent !== currentPath) { currentPath = parent; render(); }

            if (item.name.toLowerCase().endsWith('.stl')) {
                const alreadyShowing = overlay.classList.contains('open')
                    && document.getElementById('modal-path').textContent === target;
                if (!alreadyShowing) window.openModal(item.name, `${RAW}/${item.path}`, item.path);
            }
        }

        window.addEventListener('hashchange', applyHash);

        // Every folder is already in memory from the single tree fetch,
        // so navigation never hits the network.
        window.navigate = function (path) {
            currentPath = path;
            render();
            setHash(path);
        };

        // Bumped on every open and close so a slow download that finishes late
        // cannot draw itself into a modal the user has already moved on from.
        let loadToken = 0;

        window.openModal = async function (name, url, path) {
            const token = ++loadToken;

            document.getElementById('modal-name').textContent = name;
            document.getElementById('modal-path').textContent = path;
            document.getElementById('modal-dims').textContent = '';
            document.getElementById('dl-btn').href = url;
            document.getElementById('dl-btn').download = name;
            document.getElementById('overlay').classList.add('open');
            setCanvasMessage('Loading viewer...');
            setHash(path);

            try {
                await ensureThree();
            } catch {
                setCanvasMessage('3D viewer unavailable. Could not load three.js.');
                return;
            }
            if (token !== loadToken) return;   // closed, or another part opened meanwhile

            if (!renderer) {
                try {
                    initThree();
                } catch {
                    setCanvasMessage('Your browser could not start WebGL.');
                    return;
                }
            }
            loadSTL(url, token);
        };

        window.closeModal = function () {
            loadToken++;   // invalidate any download still in flight
            document.getElementById('overlay').classList.remove('open');
            destroyThree();
            setHash(currentPath);
        };

        document.getElementById('overlay').addEventListener('click', e => {
            if (e.target === document.getElementById('overlay')) window.closeModal();
        });

        function setStatus(msg) { document.getElementById('status').textContent = msg; }

        function formatSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
            return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
        }

        function timeSince(ts) {
            const mins = Math.floor((Date.now() - ts) / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return `${mins}m`;
            return `${Math.floor(mins / 60)}h`;
        }

        // Load the tree first, then honour whatever the URL hash points at.
        init().then(applyHash);
    </script>
</body>

</html>
